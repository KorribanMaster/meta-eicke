# GRUB-EFI A/B boot configuration for meta-eicke.
#
# `rootdev` (rootfs_a | rootfs_b) is persisted in grubenv on the ESP
# (ESP:/EFI/BOOT/grubenv) and flipped by SWUpdate's grub bootloader handler
# after writing the standby slot. A bootcount/ustate rollback switches back to
# the previous slot if a freshly-updated image fails to confirm a healthy boot.
#
# Per-slot kernel: the kernel is loaded from the *active slot's* /boot, so a
# rootfs update (which carries /boot/bzImage) updates the kernel too. We address
# the slot by GPT partition number on the boot drive (the raw image write
# clobbers the ext4 label, so a filesystem-label search is unreliable); the
# kernel then mounts root via PARTLABEL (GPT name, untouched by the write).

insmod part_gpt
insmod ext2
insmod regexp

# Hand the kernel a linear framebuffer so efifb/fbcon can drive the screen on
# real hardware. Without a graphics gfxpayload, grub-efi hands off in EFI text
# mode with no framebuffer in screen_info, so efifb (and earlyprintk=efi) have
# nothing to draw on and the screen stays blank after GRUB. (Serial console is
# unaffected.)
insmod efi_gop
insmod all_video
# Keep the firmware's current GOP mode (the one GRUB is already displaying on)
# and hand it to the kernel, so efifb works on whatever the panel actually
# supports (e.g. an 800x480 HDMI panel) rather than a forced resolution it
# can't show. i915 (from kernel-modules) then drives the panel via EDID.
set gfxpayload=keep

set default=0
set timeout=3

load_env

# First boot (no grubenv yet) -> slot A
if [ -z "${rootdev}" ]; then
    set rootdev="rootfs_a"
fi

# Rollback: ustate=1 means "update on trial". Give it one boot; if it comes back
# unconfirmed (the confirm service didn't clear ustate), switch to the other
# slot and mark FAILED. These save_env calls run while ${root} is still the ESP.
if [ "${ustate}" = "1" ]; then
    if [ "${bootcount}" = "1" ]; then
        if [ "${rootdev}" = "rootfs_a" ]; then
            set rootdev="rootfs_b"
        else
            set rootdev="rootfs_a"
        fi
        set ustate="3"
        save_env rootdev ustate
    else
        set bootcount="1"
        save_env bootcount
    fi
fi

# Map the active slot to its GPT partition number (matches the .wks order:
# p1=esp, p2=rootfs_a, p3=rootfs_b, p4=data).
if [ "${rootdev}" = "rootfs_a" ]; then
    set slot=2
else
    set slot=3
fi

menuentry "Eicke Linux (${rootdev})" {
    # Derive the boot drive from ${root} (e.g. "hd0,gpt1" -> "hd0"), then point
    # root at the active slot partition on that same drive and load its kernel.
    regexp --set=1:bootdrive '^([^,]+),' "${root}"
    set root="${bootdrive},gpt${slot}"
    # console=ttyS0,115200: an unspecified baud defaults to 9600, which throttles
    # kernel printk and adds ~10s to boot (the early log buffer flushes to the
    # serial port synchronously). 115200 makes serial output fast.
    linux /boot/bzImage root=PARTLABEL=${rootdev} rootwait console=ttyS0,115200 console=tty0
}
