# The gadget's ACM console: no terminal reset and no size query by systemd.
# Both write to the tty while holding the /dev/console lock, and a write to
# ttyGS0 blocks until a host opens the port, so with the OTG port unplugged
# the console getty (ttyPS0) would wait for that lock forever.
[Service]
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
TTYRows=24
TTYColumns=80
