# Compile the eicke A/B boot logic into U-Boot's default environment as the
# built-in bootcmd, so the boot logic is part of the (signable) U-Boot binary
# instead of a tamperable boot.scr on FAT — the ARM analog of x86's signed grub
# boot-menu.inc. The env whitelist (eicke-env-fat.cfg) keeps uboot.env from
# overriding bootcmd; the A/B *state* (rootdev/ustate/bootcount) still lives in
# uboot.env on FAT. Overrides qemu_arm's bootstd default bootcmd.
#
# Logic mirrors the former boot.cmd / files/wic/grub.cfg: canonicalize rootdev
# (untrusted env -> literal), ustate/bootcount rollback, slot->partition, prefer
# the signed /boot/fitImage via bootm (zImage/bootz fallback), boot with qemu's
# runtime DTB copied to free RAM. ${...} is literal in Kconfig (runtime-expanded
# by U-Boot); inner double-quotes are escaped \".
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="if test \"${rootdev}\" != rootfs_b; then setenv rootdev rootfs_a; fi; if test \"${ustate}\" = 1; then if test \"${bootcount}\" = 1; then if test \"${rootdev}\" = rootfs_a; then setenv rootdev rootfs_b; else setenv rootdev rootfs_a; fi; setenv ustate 3; saveenv; else setenv bootcount 1; saveenv; fi; fi; if test \"${rootdev}\" = rootfs_a; then setenv slot 2; else setenv slot 3; fi; setenv bootargs \"root=PARTLABEL=${rootdev} rootwait console=ttyAMA0,115200\"; setenv fdt_addr_r 0x44000000; cp.b ${fdtcontroladdr} ${fdt_addr_r} 0x100000; if ext4load virtio 0:${slot} 0x41000000 /boot/fitImage; then echo \"Eicke Linux (${rootdev}): booting signed /boot/fitImage\"; bootm 0x41000000 - ${fdt_addr_r}; else echo \"Eicke Linux (${rootdev}): booting /boot/zImage\"; ext4load virtio 0:${slot} ${kernel_addr_r} /boot/zImage; bootz ${kernel_addr_r} - ${fdt_addr_r}; fi"
