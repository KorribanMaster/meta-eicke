# ax7015b on top of xilinx_zynq_virt_defconfig.
#
# Board device tree: zynq-ax7015b.dts (files/dts, copied into arch/arm/dts by
# the bbappend). SPL builds board/xilinx/zynq/<this name>/ps7_init_gpl.c in,
# the DDR/clock/MIO init from the Vivado reference design (replaces the FSBL).
CONFIG_DEFAULT_DEVICE_TREE="zynq-ax7015b"
CONFIG_OF_LIST="zynq-ax7015b"

# eicke: persist the U-Boot environment as uboot.env on the FAT boot partition
# of the microSD (mmc 0 = sdhci0, partition 1), so U-Boot and userspace
# (libubootenv via /etc/fw_env.config -> /boot/uboot.env) share the A/B state
# exactly like qemuarm-uboot. The Zynq board code picks the FAT env when it
# booted from SD. Replaces the virt defconfig's redundant env in QSPI/NAND.
#
# CONFIG_ENV_SIZE must match the mkenvimage -s size in ubootenv.bb and the env
# size column in libubootenv's fw_env.config (0x10000 everywhere).
# CONFIG_ENV_IS_NOWHERE is not set
# CONFIG_ENV_IS_IN_NAND is not set
# CONFIG_ENV_IS_IN_SPI_FLASH is not set
# CONFIG_ENV_REDUNDANT is not set
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="mmc"
CONFIG_ENV_FAT_DEVICE_AND_PART="0:1"
CONFIG_ENV_FAT_FILE="uboot.env"
CONFIG_ENV_SIZE=0x10000
CONFIG_FS_FAT=y
CONFIG_FAT_WRITE=y

# Environment containment, as on qemuarm-uboot: the FAT env file is
# attacker-writable, so only whitelisted variables (A/B contract + the ones
# U-Boot and the board code set at runtime) may enter the environment; the
# list is CFG_ENV_FLAGS_LIST_STATIC in 0001-zynq-eicke-env-flags-whitelist.patch.
CONFIG_ENV_WRITEABLE_LIST=y

# Compile the eicke A/B boot logic into U-Boot's default environment as the
# built-in bootcmd (replacing distro_bootcmd), as on qemuarm-uboot and
# ccimx8mn-dvk: the logic is part of the U-Boot binary, the A/B *state*
# (rootdev/ustate/bootcount) lives in uboot.env on FAT.
#
# Logic mirrors recipes-bsp/u-boot/files/eicke-bootcmd.cfg and
# files/wic/grub.cfg: canonicalize rootdev (untrusted env -> literal),
# ustate/bootcount rollback, slot -> MBR partition (p2/p3), then load the
# active slot's /boot/zImage + zynq-ax7015b.dtb from the microSD. root= is the
# slot partition's PARTUUID (<disk id>-<nn> on MBR), not a label: the eMMC may
# carry another rootfs. eicke.slot= tells userspace (the SWUpdate hook) which
# slot this is.
#
# Load addresses are literals: zImage at 32 MiB, DTB at 48 MiB, clear of the
# decompressed kernel at 0x8000 (the stock fdt_addr_r 0x1f00000 is not).
# ${...} is literal in Kconfig (runtime-expanded by U-Boot); inner
# double-quotes are escaped \".
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="if test \"${rootdev}\" != rootfs_b; then setenv rootdev rootfs_a; fi; if test \"${ustate}\" = 1; then if test \"${bootcount}\" = 1; then if test \"${rootdev}\" = rootfs_a; then setenv rootdev rootfs_b; else setenv rootdev rootfs_a; fi; setenv ustate 3; saveenv; else setenv bootcount 1; saveenv; fi; fi; if test \"${rootdev}\" = rootfs_a; then setenv slot 2; else setenv slot 3; fi; if load mmc 0:${slot} 0x2000000 /boot/zImage && load mmc 0:${slot} 0x3000000 /boot/zynq-ax7015b.dtb; then part uuid mmc 0:${slot} rootuuid; setenv bootargs \"root=PARTUUID=${rootuuid} eicke.slot=${rootdev} rootwait console=ttyPS0,115200\"; echo \"Eicke Linux (${rootdev}): booting /boot/zImage\"; bootz 0x2000000 - 0x3000000; fi; echo \"Eicke Linux (${rootdev}): no bootable kernel in slot ${slot}\""
