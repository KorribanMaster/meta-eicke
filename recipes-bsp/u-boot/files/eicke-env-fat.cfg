# eicke: persist the U-Boot environment as uboot.env on the FAT boot partition
# (virtio disk 0, partition 1), so U-Boot and userspace (libubootenv via
# /etc/fw_env.config -> /boot/uboot.env) share the A/B state exactly like
# grubenv-on-ESP on the x86 machines.
#
# CONFIG_ENV_SIZE must match the mkenvimage -s size in ubootenv.bb and the env
# size column in libubootenv's fw_env.config (0x10000 everywhere).
# CONFIG_ENV_IS_IN_FLASH is not set
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="virtio"
CONFIG_ENV_FAT_DEVICE_AND_PART="0:1"
CONFIG_ENV_FAT_FILE="uboot.env"
CONFIG_ENV_SIZE=0x10000
CONFIG_FAT_WRITE=y
