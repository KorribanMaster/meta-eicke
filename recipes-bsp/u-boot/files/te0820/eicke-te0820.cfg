# te0820 on top of xilinx_zynqmp_virt_defconfig.
#
# Board device tree: zynqmp-te0820.dts (files/dts, copied into arch/arm/dts by
# the bbappend). SPL builds board/xilinx/zynqmp/<this name>/psu_init_gpl.c in,
# the DDR/clock/MIO init from the Trenz reference design (replaces the FSBL).
CONFIG_DEFAULT_DEVICE_TREE="zynqmp-te0820"
CONFIG_OF_LIST="zynqmp-te0820"

# PMU firmware, packed into boot.bin by mkimage (the boot ROM loads it into
# the PMU), and the PM configuration object SPL hands to it at runtime. Both
# are copied next to psu_init_gpl.c by the bbappend; the paths are relative to
# the U-Boot source tree.
CONFIG_PMUFW_INIT_FILE="board/xilinx/zynqmp/zynqmp-te0820/pmufw.bin"
CONFIG_ZYNQMP_SPL_PM_CFG_OBJ_FILE="board/xilinx/zynqmp/zynqmp-te0820/pm_cfg_obj.bin"

# eicke: persist the U-Boot environment as uboot.env on the FAT boot partition
# of the microSD, as on ax7015b. The microSD is SD1 (sdhci1); the device tree
# makes it mmc0 (alias), so the env is on mmc 0:1 and the eMMC (sdhci0) is
# mmc1. Replaces the virt defconfig's env chain (nowhere, FAT auto, NAND and
# redundant SPI flash).
#
# CONFIG_ENV_SIZE must match the mkenvimage -s size in ubootenv.bb and the env
# size column in libubootenv's fw_env.config (0x10000 everywhere).
# CONFIG_ENV_IS_NOWHERE is not set
# CONFIG_ENV_IS_IN_NAND is not set
# CONFIG_ENV_IS_IN_SPI_FLASH is not set
# CONFIG_ENV_REDUNDANT is not set
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="mmc"
CONFIG_ENV_FAT_DEVICE_AND_PART="0:1"
CONFIG_ENV_FAT_FILE="uboot.env"
CONFIG_ENV_SIZE=0x10000
CONFIG_FS_FAT=y
CONFIG_FAT_WRITE=y

# Environment containment, as on ax7015b: the FAT env file is
# attacker-writable, so only whitelisted variables (A/B contract + the ones
# U-Boot and the board code set at runtime) may enter the environment; the
# list is CFG_ENV_FLAGS_LIST_STATIC in 0001-zynqmp-eicke-env-flags-whitelist.patch.
CONFIG_ENV_WRITEABLE_LIST=y

# Compile the eicke A/B boot logic into U-Boot's default environment as the
# built-in bootcmd (replacing distro_bootcmd), as on ax7015b: the logic is part
# of the U-Boot binary, the A/B *state* (rootdev/ustate/bootcount) lives in
# uboot.env on FAT.
#
# Logic mirrors recipes-bsp/u-boot/files/ax7015b/eicke-ax7015b.cfg:
# canonicalize rootdev (untrusted env -> literal), ustate/bootcount rollback,
# slot -> MBR partition (p2/p3), then load the active slot's /boot/Image +
# zynqmp-te0820.dtb from the microSD. root= is the slot partition's PARTUUID
# (<disk id>-<nn> on MBR), not a label: the eMMC may carry another rootfs.
# eicke.slot= tells userspace (the SWUpdate hook) which slot this is.
#
# Load addresses are literals: Image at 2 MiB (booti needs 2 MiB alignment),
# DTB at 64 MiB, both below U-Boot at 128 MiB (CONFIG_TEXT_BASE).
# ${...} is literal in Kconfig (runtime-expanded by U-Boot); inner
# double-quotes are escaped \".
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="if test \"${rootdev}\" != rootfs_b; then setenv rootdev rootfs_a; fi; if test \"${ustate}\" = 1; then if test \"${bootcount}\" = 1; then if test \"${rootdev}\" = rootfs_a; then setenv rootdev rootfs_b; else setenv rootdev rootfs_a; fi; setenv ustate 3; saveenv; else setenv bootcount 1; saveenv; fi; fi; if test \"${rootdev}\" = rootfs_a; then setenv slot 2; else setenv slot 3; fi; if load mmc 0:${slot} 0x200000 /boot/Image && load mmc 0:${slot} 0x4000000 /boot/zynqmp-te0820.dtb; then part uuid mmc 0:${slot} rootuuid; setenv bootargs \"root=PARTUUID=${rootuuid} eicke.slot=${rootdev} rootwait console=ttyPS0,115200\"; echo \"Eicke Linux (${rootdev}): booting /boot/Image\"; booti 0x200000 - 0x4000000; fi; echo \"Eicke Linux (${rootdev}): no bootable kernel in slot ${slot}\""

# The virt defconfig's preboot ("run scsi_init;usb start") references the
# distro boot env and probes USB on every boot; the eicke bootcmd needs
# neither.
# CONFIG_USE_PREBOOT is not set
