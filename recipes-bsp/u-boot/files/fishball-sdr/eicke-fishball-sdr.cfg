# fishball-sdr on top of xilinx_zynq_virt_defconfig.
#
# Board device tree: zynq-fishball-sdr.dts (files/dts, copied into arch/arm/dts
# by the bbappend). SPL builds board/xilinx/zynq/<this name>/ps7_init_gpl.c in,
# the DDR/clock/MIO init from the vendor's system_top.xsa (replaces the FSBL).
CONFIG_DEFAULT_DEVICE_TREE="zynq-fishball-sdr"
CONFIG_OF_LIST="zynq-fishball-sdr"

# eicke: persist the U-Boot environment as uboot.env on the FAT boot partition
# of the microSD (mmc 0 = sdhci0, partition 1), exactly as on ax7015b.
#
# CONFIG_ENV_SIZE must match the mkenvimage -s size in ubootenv.bb and the env
# size column in libubootenv's fw_env.config (0x10000 everywhere).
# CONFIG_ENV_IS_NOWHERE is not set
# CONFIG_ENV_IS_IN_NAND is not set
# CONFIG_ENV_IS_IN_SPI_FLASH is not set
# CONFIG_ENV_REDUNDANT is not set
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="mmc"
CONFIG_ENV_FAT_DEVICE_AND_PART="0:1"
CONFIG_ENV_FAT_FILE="uboot.env"
CONFIG_ENV_SIZE=0x10000
CONFIG_FS_FAT=y
CONFIG_FAT_WRITE=y

# Environment containment, as on ax7015b: the FAT env file is
# attacker-writable, so only whitelisted variables may enter the environment;
# the list is CFG_ENV_FLAGS_LIST_STATIC in
# 0001-zynq-eicke-env-flags-whitelist-fishball-sdr.patch. It also has to hold
# every variable userspace keeps in uboot.env with fw_setenv (the AD936x
# variant, xo_correction, ...): U-Boot drops the others on its next saveenv.
CONFIG_ENV_WRITEABLE_LIST=y

# Compile the eicke A/B boot logic into U-Boot's default environment as the
# built-in bootcmd, as on ax7015b: the logic is part of the U-Boot binary, the
# A/B *state* (rootdev/ustate/bootcount) lives in uboot.env on FAT.
#
# Logic mirrors recipes-bsp/u-boot/files/ax7015b/eicke-ax7015b.cfg
# (canonicalize rootdev, ustate/bootcount rollback, slot -> MBR partition
# p2/p3, root=PARTUUID, eicke.slot=), plus the PL:
#  1. The active slot's /boot/fishball-sdr.bit is loaded into the PL first
#     (fpga loadb; U-Boot's Zynq driver then enables the PS-PL level
#     shifters). The bitstream belongs to the slot like the kernel, so an A/B
#     update and a rollback switch both together. Without it the slot does not
#     boot: the device tree describes the PL cores, and touching them with the
#     PL unconfigured hangs the bus.
#  2. The AD936x variant, from the untrusted env, canonicalized to literals
#     like rootdev, is patched into the slot's device tree (node paths from
#     zynq-fishball-sdr-ad936x.dts), as Pluto's adi_loadvals does:
#       ad936x_model  ad9361 (default) | ad9363a | ad9364
#       ad936x_mode   2r2t (default) | 1r1t; ad9364 is always 1r1t
#     1r1t drops adi,2rx-2tx-mode-enable and switches the DDS core to its
#     one-channel (ad9364) compatible.
# panic=10 reboots a panicking kernel (e.g. a trial slot that cannot mount
# its rootfs), so the bootcmd's rollback runs.
#
# Load addresses are literals: bitstream at 64 MiB (4 MB), zImage at 32 MiB,
# DTB at 48 MiB, clear of the decompressed kernel at 0x8000.
# ${...} is literal in Kconfig (runtime-expanded by U-Boot); inner
# double-quotes are escaped \".
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="if test \"${rootdev}\" != rootfs_b; then setenv rootdev rootfs_a; fi; if test \"${ustate}\" = 1; then if test \"${bootcount}\" = 1; then if test \"${rootdev}\" = rootfs_a; then setenv rootdev rootfs_b; else setenv rootdev rootfs_a; fi; setenv ustate 3; saveenv; else setenv bootcount 1; saveenv; fi; fi; if test \"${rootdev}\" = rootfs_a; then setenv slot 2; else setenv slot 3; fi; if test \"${ad936x_model}\" != ad9363a && test \"${ad936x_model}\" != ad9364; then setenv ad936x_model ad9361; fi; if test \"${ad936x_model}\" = ad9364; then setenv ad936x_mode 1r1t; elif test \"${ad936x_mode}\" != 1r1t; then setenv ad936x_mode 2r2t; fi; if load mmc 0:${slot} 0x4000000 /boot/fishball-sdr.bit && fpga loadb 0 0x4000000 ${filesize} && load mmc 0:${slot} 0x2000000 /boot/zImage && load mmc 0:${slot} 0x3000000 /boot/zynq-fishball-sdr-ad936x.dtb; then fdt addr 0x3000000; fdt resize 0x1000; fdt set /axi/spi@e0006000/ad9361-phy@0 compatible adi,${ad936x_model}; if test \"${ad936x_mode}\" = 1r1t; then fdt rm /axi/spi@e0006000/ad9361-phy@0 adi,2rx-2tx-mode-enable; fdt set /fpga-axi@0/cf-ad9361-dds-core-lpc@79024000 compatible adi,axi-ad9364-dds-6.00.a; fi; part uuid mmc 0:${slot} rootuuid; setenv bootargs \"root=PARTUUID=${rootuuid} eicke.slot=${rootdev} rootwait panic=10 console=ttyPS0,115200\"; echo \"Eicke Linux (${rootdev}): booting /boot/zImage (${ad936x_model} ${ad936x_mode})\"; bootz 0x2000000 - 0x3000000; fi; echo \"Eicke Linux (${rootdev}): no bootable kernel and bitstream in slot ${slot}\""

# The virt defconfig's preboot ("run scsi_init;usb start") references the
# distro boot env and probes USB on every boot; the eicke bootcmd needs
# neither.
# CONFIG_USE_PREBOOT is not set

# Start the system watchdog (watchdog0 in the device tree) in U-Boot and leave
# it running into Linux, as on te0820: the kernel's cadence driver neither
# stops nor feeds it until systemd opens it (eicke-watchdog), so a kernel that
# hangs before that is reset too, and the bootcmd rolls a trial slot back.
# U-Boot does not feed it, on purpose: a boot stuck at the prompt (e.g. a
# trial slot without a kernel or bitstream) is reset after 60 s into the
# rollback. Type "wdt stop" to work at the prompt for longer.
CONFIG_WDT=y
CONFIG_WDT_CDNS=y
CONFIG_WATCHDOG_AUTOSTART=y
CONFIG_WATCHDOG_TIMEOUT_MSECS=60000
