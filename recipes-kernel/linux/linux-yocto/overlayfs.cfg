# Kernel config delta for the prod image's overlayfs-etc feature: a writable
# overlay is laid over /etc at early boot (preinit), backed by the data
# partition, so /etc changes persist while the rootfs stays read-only. The
# overlay mount needs the overlay filesystem built into the kernel (=y so it is
# available in the preinit before any module could be loaded).
CONFIG_OVERLAY_FS=y
