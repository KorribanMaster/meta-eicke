# Fish Ball SDR on top of ADI's zynq_xcomm_adv7511_defconfig (linux-adi),
# which already has the Zynq PS drivers (MACB, PS UART, Arasan SDHCI, Zynq
# GPIO and SPI, FPGA manager, Cadence watchdog), ext4 and all ADI drivers
# (AD9361, cf_axi_adc/dds, AXI DMAC).
#
# The bootloader passes the command line (eicke bootcmd); drop the
# defconfig's ramdisk one.
CONFIG_CMDLINE=""

# PS Ethernet PHY: RTL8211E.
CONFIG_REALTEK_PHY=y

# System watchdog, started by U-Boot and fed by systemd (eicke-watchdog).
CONFIG_WATCHDOG=y
CONFIG_CADENCE_WATCHDOG=y

# OTG port: ChipIdea in both roles, USB3320C as a plain ULPI transceiver
# (usb-nop-xceiv), and the gadget functions fishball-sdr-gadget composes over
# configfs (Pluto's set: RNDIS or ECM/NCM networking, ACM console, FunctionFS
# for iiod's USB backend).
CONFIG_USB_CHIPIDEA=y
CONFIG_USB_CHIPIDEA_UDC=y
CONFIG_USB_CHIPIDEA_HOST=y
CONFIG_NOP_USB_XCEIV=y
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_CONFIGFS_F_FS=y

# What systemd needs beyond the defconfig (made for a busybox ramdisk).
CONFIG_AUTOFS_FS=y
CONFIG_FHANDLE=y
CONFIG_SECCOMP=y
CONFIG_TMPFS_XATTR=y
