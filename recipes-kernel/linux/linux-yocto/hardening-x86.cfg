# x86-only hardening (see hardening.cfg for the machine-independent set).

# Remove the legacy fixed-address vsyscall page entirely -- a classic
# known-address ROP/exploit target. The machine configs ship XONLY, which
# still maps the (execute-only) page; modern glibc never touches it.
# TODO(doc/security.md): consider IA32_EMULATION=n too -- no image
# ships 32-bit userspace, but field use of 32-bit tools on genericx86-64 is
# unproven, so it stays enabled for now.
CONFIG_LEGACY_VSYSCALL_NONE=y
