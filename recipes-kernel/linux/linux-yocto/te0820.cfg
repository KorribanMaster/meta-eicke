# Trenz TE0820-02 on top of kernel-cache's amd-zynqmp BSP (which already has
# the ZynqMP PS drivers: MACB, PS UART, GQSPI, Arasan SDHCI, DWC3 USB with
# ULPI, Cadence I2C, AT24 EEPROM, ZynqMP firmware/clock/pinctrl, the R5
# remoteproc).
#
# PS Ethernet PHY on the module (GEM3, RGMII, MDIO address 1): a Marvell
# 88E151x (driver "Marvell 88E1510" in the Trenz boot log).
CONFIG_MARVELL_PHY=y

# The R5s' RustAmp echo firmware (rustamp-r5-echo) announces rpmsg-tty:
# RPMSG_TTY gives /dev/ttyRPMSG0/1. The R5 remoteproc, the IPI mailbox and
# virtio rpmsg come from the amd-zynqmp BSP.
CONFIG_RPMSG_TTY=y
