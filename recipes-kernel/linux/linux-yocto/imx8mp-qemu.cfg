# i.MX 8M Plus support for qemuimx8mp-evk (QEMU imx8mp-evk, direct kernel boot).
#
# KMACHINE stays qemuarm64 (virt-only BSP), so nothing in kernel-cache
# redefines these and the =y survive the fragment merge order (user fragments
# merge before kernel-cache features; genericarm64 would turn most of this
# into =m). Everything on the root-mount path is built in: there is no
# initramfs, the rootfs is on the emulated uSDHC3 SD card.

# SoC: clocks, pinmux, power domains, GPIO, syscon (GPR/SRC for imx_rproc).
# Since 6.18 ARCH_MXC sits inside "menuconfig ARCH_NXP": without ARCH_NXP the
# whole i.MX block silently vanishes from .config (no configcheck warning).
CONFIG_ARCH_NXP=y
CONFIG_ARCH_MXC=y
CONFIG_SOC_IMX8M=y
CONFIG_CLK_IMX8MP=y
# PINCTRL and REGULATOR are menuconfigs that default to off in the qemuarm64
# BSP; without them PINCTRL_IMX8MP / REGULATOR_FIXED_VOLTAGE silently vanish
# and every uSDHC/UART/FEC defers forever waiting for its pin group.
CONFIG_PINCTRL=y
CONFIG_PINCTRL_IMX8MP=y
CONFIG_REGULATOR=y
CONFIG_IMX_GPCV2_PM_DOMAINS=y
CONFIG_IMX8M_BLK_CTRL=y
CONFIG_GPIO_MXC=y
CONFIG_MFD_SYSCON=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y

# Console: UART2 (ttymxc1)
CONFIG_SERIAL_IMX=y
CONFIG_SERIAL_IMX_CONSOLE=y

# Root filesystem: uSDHC
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_ESDHC_IMX=y

# Networking: ENET (FEC) for slirp/SSH
CONFIG_NET_VENDOR_FREESCALE=y
CONFIG_FEC=y

# Cortex-M7 via remoteproc: MU mailbox, imx_rproc, rpmsg_tty (/dev/ttyRPMSG0).
# REMOTEPROC/RPMSG_VIRTIO/RPMSG_CHAR/RPMSG_CTRL come from zynq-rproc.cfg.
CONFIG_MAILBOX=y
CONFIG_IMX_MBOX=y
CONFIG_IMX_REMOTEPROC=y
CONFIG_RPMSG_TTY=y
