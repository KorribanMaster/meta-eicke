# ALINX AX7015B on top of kernel-cache's amd-zynq BSP (which already has the
# Zynq PS drivers: MACB, PS UART, Zynq QSPI, Arasan SDHCI, ChipIdea USB with
# the nop ULPI transceiver, Zynq GPIO, FPGA manager).
#
# PS Ethernet PHY: JL2121 on current boards (no upstream driver, the generic
# PHY driver handles it), KSZ9031 on older ones.
CONFIG_MICREL_PHY=y

# AMP: CPU1 runs the RustAmp A9 firmware (rustamp-a9-echo, started by the
# a9-rproc module), so Linux must leave it offline. maxcpus=1 is appended to
# the bootloader's command line by the kernel itself, so it travels with each
# A/B slot's kernel (U-Boot's bootcmd is not part of an update). The firmware
# announces rpmsg-tty: RPMSG_TTY gives /dev/ttyRPMSG0. remoteproc and
# rpmsg_virtio are already on (zynq-rproc.cfg).
CONFIG_CMDLINE="maxcpus=1"
CONFIG_CMDLINE_EXTEND=y
CONFIG_RPMSG_TTY=y
