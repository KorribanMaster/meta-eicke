# Kernel security hardening (all machines; see linux-yocto_%.bbappend for why
# dev images share it). Pure delta: options the machine configs already set
# (STRICT_KERNEL_RWX, RANDOMIZE_BASE, STACKPROTECTOR_STRONG, VMAP_STACK,
# BPF_UNPRIV_DEFAULT_OFF, KEXEC off) are not restated here.

# Module signing: every module built by this kernel (and out-of-tree modules
# built via module.bbclass, e.g. zynq-pcie-rproc) is signed at
# modules_install; FORCE rejects anything unsigned at load time. Prod ships a
# trimmed module set and dev loads more -- but ALL modules on any eicke image
# come from this same kernel build, so forcing costs nothing.
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_SHA512=y
CONFIG_MODULE_SIG_FORCE=y

# Lockdown LSM, integrity mode baked in. Mainline does NOT auto-engage
# lockdown under UEFI Secure Boot (that is a distro patch we don't carry, and
# qemuarm-uboot has no UEFI anyway), so force it at build time. Integrity
# mode blocks raw physical-memory access, kexec, unsigned modules, MSR
# writes, etc., but keeps tracing/perf/debugfs (that would be
# "confidentiality") usable on dev images. CONFIG_LSM in the machine configs
# already lists lockdown (and yama), so no LSM-order change is needed.
# SECURITYFS exposes /sys/kernel/security/lockdown for verification.
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY=y
CONFIG_SECURITYFS=y

# Yama: scoped ptrace. The policy value is per-image (prod sets
# kernel.yama.ptrace_scope=1 via eicke-sysctl-hardening; dev keeps 0).
CONFIG_SECURITY_YAMA=y

# Memory-safety hardening. Small, flat costs (INIT_ON_ALLOC ~1% on
# allocation paths; boot-time revert with init_on_alloc=0 for benchmarks).
# Applies to dev too, on purpose: a corruption caught on a dev image is a bug
# found before production.
CONFIG_FORTIFY_SOURCE=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_SLAB_FREELIST_RANDOM=y
CONFIG_SLAB_FREELIST_HARDENED=y
CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
CONFIG_BUG_ON_DATA_CORRUPTION=y

# Attack-surface removal. Nothing in the images reads /dev/mem (TPM tools use
# /dev/tpmrm0, grub-editenv/efibootmgr use the ESP/efivarfs) or /proc/kcore.
CONFIG_DEVMEM=n
CONFIG_PROC_KCORE=n
