# Kernel config delta for the Zynq PCIe remoteproc host driver
# (zynq-pcie-rproc.ko). The driver links against EXPORT_SYMBOL_GPL()s from the
# remoteproc core and drives the firmware over the Linux rpmsg/virtio stack.
#
# DMA_DECLARE_COHERENT is required by the remoteproc core: it backs the
# vdev0buffer carveout via dma_declare_coherent_memory() (remoteproc_virtio.c),
# which is how the rpmsg buffer pool is pinned into the BAR1 / Zynq-DDR window so
# the A9 firmware can reach it.  Without it the host aborts virtio bring-up with
# "rproc-virtio: Failed to associate buffer" / "failed to probe subdevices: -38"
# and the A9 spins forever in rproc_virtio_wait_remote_ready().
#
# It is a PROMPTLESS bool, so it cannot be requested directly (oldconfig drops it
# and do_kernel_configcheck flags "requested value did not make it into config").
# An earlier note here claimed REMOTEPROC selects it — that is FALSE for this
# kernel (6.18): the built genericx86-64 config has REMOTEPROC=y but no
# DMA_DECLARE_COHERENT.  In 6.18 it is selected only by arch/arm, arch/sh,
# DMA_GLOBAL_POOL (also promptless), and OF_EARLY_FLATTREE.  On x86-64 the only
# config-reachable path is OF:
#     CONFIG_OF=y -> OF_EARLY_FLATTREE (def_bool OF)
#                 -> select DMA_DECLARE_COHERENT if HAS_DMA && HAS_IOMEM (both =y)
#
# WORKAROUND, not the clean fix.  CONFIG_OF=y is enabled purely to pull in
# DMA_DECLARE_COHERENT through the select chain above.  This host boots via
# UEFI/ACPI and is never handed a device tree, so OF stays dormant (of_root ==
# NULL, every of_node lookup misses, ACPI/platform data stays authoritative) -
# benign here, but it is a config-side crutch.  The principled alternative is to
# stop depending on the remoteproc coherent-memory path entirely: have
# zynq-pcie-rproc manage the BAR1 vrings/buffers itself (ioremap + hand-built
# vrings), which would drop both this line and the DMA_DECLARE_COHERENT
# requirement.  Until that rewrite exists, keep CONFIG_OF=y.
#
# (Comment lines here avoid a leading "# CONFIG_<symbol>" — configcheck would
# otherwise mistake it for a malformed "# CONFIG_x is not set" directive.)
#
# RPMSG_VIRTIO selects RPMSG / VIRTIO / VIRTIO_RING. RPMSG_CHAR + RPMSG_CTRL
# provide the /dev/rpmsg_ctrl* + /dev/rpmsgN char ABI the userspace test suite
# (driver/test) exercises.
CONFIG_REMOTEPROC=y
CONFIG_RPMSG_VIRTIO=y
CONFIG_RPMSG_CHAR=y
CONFIG_RPMSG_CTRL=y

# Workaround: pulls in the promptless DMA_DECLARE_COHERENT (see header above).
# Remove once the driver manages BAR1 buffers without the coherent-memory path.
CONFIG_OF=y
