# Kernel config delta for the Zynq PCIe remoteproc host driver
# (zynq-pcie-rproc.ko). The driver links against EXPORT_SYMBOL_GPL()s from the
# remoteproc core and drives the firmware over the Linux rpmsg/virtio stack.
#
# NOTE: CONFIG_DMA_DECLARE_COHERENT (needed for the vdev0buffer carveout's
# dma_declare_coherent_memory()) is deliberately NOT listed here — it has no
# Kconfig prompt and is not user-settable. REMOTEPROC `select`s it, so enabling
# CONFIG_REMOTEPROC pulls it in. Listing it explicitly would make
# do_kernel_configcheck flag it as "requested value did not make it into config".
#
# RPMSG_VIRTIO selects RPMSG / VIRTIO / VIRTIO_RING. RPMSG_CHAR + RPMSG_CTRL
# provide the /dev/rpmsg_ctrl* + /dev/rpmsgN char ABI the userspace test suite
# (driver/test) exercises.
CONFIG_REMOTEPROC=y
CONFIG_RPMSG_VIRTIO=y
CONFIG_RPMSG_CHAR=y
CONFIG_RPMSG_CTRL=y
