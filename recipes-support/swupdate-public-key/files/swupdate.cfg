# Default SWUpdate configuration (swupdate auto-loads /etc/swupdate.cfg via
# CONFIG_DEFAULT_CONFIG_FILE). Point verification at the shipped public key so
# both the daemon (swupdate.sh) and the manual A/B CLI
# (`swupdate -i <bundle>.swu`) reject any .swu whose sw-description signature
# does not verify against this key.
globals =
{
    public-key-file = "/etc/swupdate/public.pem";
};
