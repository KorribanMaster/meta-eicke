# qemuarm-uboot: swap swupdate's bootenv backend GRUB -> U-Boot (libubootenv).
# Merged onto files/defconfig by the recipe's merge_config.sh step; the recipe
# also scans this fragment and adds the libubootenv DEPENDS/RDEPENDS.
# fw_env.config comes from the libubootenv bbappend (env file /boot/uboot.env).
# CONFIG_BOOTLOADER_GRUB is not set
# CONFIG_BOOTLOADER_DEFAULT_GRUB is not set
CONFIG_UBOOT=y
CONFIG_UBOOT_FWENV="/etc/fw_env.config"
CONFIG_BOOTLOADER_DEFAULT_UBOOT=y
