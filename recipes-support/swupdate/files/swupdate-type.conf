# Our swupdate is built without CONFIG_SYSTEMD (no sd_notify), but meta-swupdate
# ships swupdate.service as Type=notify -> systemd waits for a READY notification
# that never comes and times the unit out (service fails, system "degraded").
# Override to Type=simple: the daemon (web UI + IPC sockets) runs fine; systemd
# just considers it started once the process is up.
[Service]
Type=simple
