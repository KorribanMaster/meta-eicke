# eicke production sysctl hardening (eicke-sysctl-hardening).
# Applied by systemd-sysctl at boot. Prod images only -- dev images keep the
# kernel defaults so gdb/perf/bpftrace work without friction.

# Hide kernel pointers and the kernel log from unprivileged users.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# perf/tracing for root only (3 = disallow all unprivileged perf_event use;
# stricter than the kernel's paranoid=2 default).
kernel.perf_event_paranoid = 3

# No magic-sysrq on a fielded box.
kernel.sysrq = 0

# Yama: only ancestor processes may ptrace (a debugger can still attach to
# its own children; arbitrary same-uid attach is blocked).
kernel.yama.ptrace_scope = 1

# Unprivileged BPF off, pinned: the kernel already defaults off via
# BPF_UNPRIV_DEFAULT_OFF, but value 1 (vs the default 2) makes re-enabling
# impossible without a reboot. Harden the JIT against spray attacks.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# No unprivileged user namespaces (a recurring privilege-escalation surface;
# nothing on the image uses containers). This is the mainline knob -- the
# Debian-only kernel.unprivileged_userns_clone does not exist on linux-yocto.
user.max_user_namespaces = 0

# Network basics: SYN-flood cookies, strict reverse-path filtering, and no
# ICMP redirects / source routing (we are a host, not a router).
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Symlink/hardlink/FIFO/regular-file protections in sticky world-writable
# dirs (classic /tmp race hardening; upstream kernel defaults are 0).
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 2
