#!/usr/sbin/nft -f
# eicke production firewall (eicke-firewall): default-deny inbound.
#
# DHCP needs no rule: networkd's DHCPv4 client uses AF_PACKET sockets, which
# bypass the inet-family hooks entirely; DHCPv6 replies match ct established.
#
# Deliberately unreachable from outside: systemd-resolved's LLMNR (5355) and
# mDNS (5353) listeners -- resolving the DEVICE's name via .local/LLMNR from
# other hosts stops working on prod.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # Diagnostics stay available; ICMPv6 is mandatory for NDP/SLAAC.
        ip protocol icmp accept
        meta l4proto ipv6-icmp accept

        # SSH (key-only, see eicke-prod-hardening.inc).
        tcp dport 22 accept

        # SWUpdate web UI (.swu upload; bundles are RSA-PSS verified, so the
        # open port is not the trust boundary). TODO(doc/security.md):
        # TLS -- CONFIG_MONGOOSESSL is compiled but no cert is configured.
        tcp dport 8080 accept
    }

    chain forward {
        # Not a router.
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
