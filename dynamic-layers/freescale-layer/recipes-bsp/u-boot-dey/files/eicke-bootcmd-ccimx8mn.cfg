# Compile the eicke A/B boot logic into U-Boot's default environment as the
# built-in bootcmd (replacing Digi's "source boot.scr"), as on qemuarm-uboot:
# the logic is part of the U-Boot binary, the A/B *state* (rootdev/ustate/
# bootcount) lives in uboot.env on FAT, and the env whitelist keeps uboot.env
# from overriding anything else.
#
# Logic mirrors recipes-bsp/u-boot/files/eicke-bootcmd.cfg and
# files/wic/grub.cfg: canonicalize rootdev (untrusted env -> literal),
# ustate/bootcount rollback, slot -> GPT partition (p2/p3), then load the
# active slot's /boot/Image + ccimx8mn-dvk.dtb from the boot device
# (${mmcbootdev}, set by Digi's board code) and apply DT overlays chosen like
# Digi's boot.txt: ccimx8mn_v1 on SOM hardware version 1 (hwid_2, a hush local
# set by the board code), ccimx8mn-dvk_v1-v2 on carrier board versions < 3,
# and always the eicke CM7 overlay for remoteproc. The wifi/bt overlays are
# left out: their firmware is not shipped, so the radios stay disabled.
# root= is the slot partition's PARTUUID, not its GPT name: the DVK's eMMC
# may carry another rootfs_a/rootfs_b (Linux saw it first and booted it).
# eicke.slot= tells userspace (the SWUpdate hook) which slot this is.
#
# Load addresses: kernel at the i.MX8M default 0x40480000, DTB and overlay
# scratch well above it (the SOM has >= 512 MiB from 0x40000000).
# ${...} is literal in Kconfig (runtime-expanded by U-Boot); inner
# double-quotes are escaped \". setexpr's & operator is quoted (\"&\"): a bare &
# is a hush syntax error that kills the whole bootcmd, and a \\& escape does
# not survive the U-Boot build (it reaches the env as a bare &).
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="if test \"${rootdev}\" != rootfs_b; then setenv rootdev rootfs_a; fi; if test \"${ustate}\" = 1; then if test \"${bootcount}\" = 1; then if test \"${rootdev}\" = rootfs_a; then setenv rootdev rootfs_b; else setenv rootdev rootfs_a; fi; setenv ustate 3; saveenv; else setenv bootcount 1; saveenv; fi; fi; if test \"${rootdev}\" = rootfs_a; then setenv slot 2; else setenv slot 3; fi; setenv eicke_ovl eicke-ccimx8mn-cm7.dtbo; if test -n \"${module_ram}\"; then setexpr som_hv ${hwid_2} \"&\" 38; setexpr som_hv ${som_hv} / 8; if test \"${som_hv}\" = 1; then setenv eicke_ovl ccimx8mn_v1.dtbo ${eicke_ovl}; fi; fi; if test \"${board_version}\" -lt 3; then setenv eicke_ovl ccimx8mn-dvk_v1-v2.dtbo ${eicke_ovl}; fi; setenv kernel_addr_r 0x40480000; setenv fdt_addr_r 0x4c000000; setenv fdtov_addr_r 0x4c100000; if load mmc ${mmcbootdev}:${slot} ${kernel_addr_r} /boot/Image && load mmc ${mmcbootdev}:${slot} ${fdt_addr_r} /boot/ccimx8mn-dvk.dtb; then fdt addr ${fdt_addr_r}; fdt resize 0x20000; for ov in ${eicke_ovl}; do if load mmc ${mmcbootdev}:${slot} ${fdtov_addr_r} /boot/${ov}; then echo \"Eicke Linux: overlay ${ov}\"; fdt apply ${fdtov_addr_r}; fi; done; part uuid mmc ${mmcbootdev}:${slot} rootuuid; setenv bootargs \"root=PARTUUID=${rootuuid} eicke.slot=${rootdev} rootwait console=ttymxc0,115200\"; echo \"Eicke Linux (${rootdev}): booting /boot/Image\"; booti ${kernel_addr_r} - ${fdt_addr_r}; fi; echo \"Eicke Linux (${rootdev}): no bootable kernel in slot ${slot}\""
