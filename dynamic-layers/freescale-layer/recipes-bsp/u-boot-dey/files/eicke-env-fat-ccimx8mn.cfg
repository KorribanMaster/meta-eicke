# eicke: persist the U-Boot environment as uboot.env on the FAT boot partition
# of the boot device (":1" = partition 1 of mmc_get_env_dev(), which Digi's
# board code returns as the boot device: the microSD on the DVK), so U-Boot and
# userspace (libubootenv via /etc/fw_env.config -> /boot/uboot.env) share the
# A/B state exactly like qemuarm-uboot. Replaces Digi's redundant env in the
# eMMC boot1 hardware partition.
#
# CONFIG_ENV_SIZE must match the mkenvimage -s size in ubootenv.bb and the env
# size column in libubootenv's fw_env.config (0x10000 everywhere).
# CONFIG_ENV_IS_IN_MMC is not set
# CONFIG_SYS_REDUNDAND_ENVIRONMENT is not set
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="mmc"
CONFIG_ENV_FAT_DEVICE_AND_PART=":1"
CONFIG_ENV_FAT_FILE="uboot.env"
CONFIG_ENV_SIZE=0x10000
CONFIG_FS_FAT=y
CONFIG_FAT_WRITE=y

# Environment containment, as on qemuarm-uboot: the FAT env file is
# attacker-writable, so only whitelisted variables (A/B contract + the ones
# U-Boot and the board code set at runtime) may enter the environment; the
# list is CFG_ENV_FLAGS_LIST_STATIC in 0001-ccimx8m-eicke-env-flags-whitelist.patch.
CONFIG_ENV_WRITEABLE_LIST=y

# Digi's dualboot (active_system, RTC bootcount, altbootcmd) would fight the
# eicke ustate/bootcount rollback in the compiled-in bootcmd: drop it.
# CONFIG_BOOTCOUNT_LIMIT is not set
# CONFIG_DM_BOOTCOUNT is not set
# CONFIG_DM_BOOTCOUNT_RTC is not set
