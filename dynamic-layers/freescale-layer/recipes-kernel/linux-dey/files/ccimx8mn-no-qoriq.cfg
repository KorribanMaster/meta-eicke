# Drop NXP's QorIQ/Layerscape network stack that Digi's generic
# ccimx8_defconfig enables: DPAA (SDK FMan/BMan/QMan, dpaa_eth) and DPAA2.
# None of it exists on the i.MX 8M Nano, and the SDK FMan driver does not
# build with CONFIG_FORTIFY_SOURCE (from the shared hardening.cfg): its
# string_ext.h/stdlib_ext.h redeclare strlen(), which collides with the fortify
# strlen macro ("expected identifier or '(' before '__builtin_choose_expr'").
# CONFIG_FSL_SDK_DPA is not set
# CONFIG_FSL_SDK_FMAN is not set
# CONFIG_FSL_SDK_DPAA_ETH is not set
# CONFIG_FSL_DPAA2 is not set
# CONFIG_FSL_DPAA2_ETH is not set
