# Cortex-M7 via remoteproc on the ccimx8mn: imx_rproc, the MU mailbox and
# rpmsg_tty (/dev/ttyRPMSG0, used by the RustAmp echo firmware + ptest).
# ccimx8_defconfig already has REMOTEPROC/IMX_REMOTEPROC/IMX_MBOX; the rpmsg
# virtio bus (RPMSG_VIRTIO/CHAR/CTRL) comes from the shared zynq-rproc.cfg.
CONFIG_MAILBOX=y
CONFIG_IMX_MBOX=y
CONFIG_REMOTEPROC=y
CONFIG_IMX_REMOTEPROC=y
CONFIG_RPMSG_TTY=y
