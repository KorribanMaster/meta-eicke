# GRUB-EFI A/B boot configuration for meta-eicke.
#
# `rootdev` (rootfs_a | rootfs_b) is persisted in grubenv next to this file
# (ESP:/EFI/BOOT/grubenv) and flipped by SWUpdate's grub bootloader handler
# after writing the standby slot. A minimal bootcount/ustate rollback switches
# back to the previous slot if a freshly-updated image fails to confirm.

insmod part_gpt
insmod ext2
insmod search_label

set default=0
set timeout=3

load_env

# First boot (no grubenv yet) -> slot A
if [ -z "${rootdev}" ]; then
    set rootdev="rootfs_a"
fi

# Rollback: ustate=1 means "update on trial". Give it one boot; if it comes
# back unconfirmed, switch to the other slot and mark FAILED.
if [ "${ustate}" = "1" ]; then
    if [ "${bootcount}" = "1" ]; then
        if [ "${rootdev}" = "rootfs_a" ]; then
            set rootdev="rootfs_b"
        else
            set rootdev="rootfs_a"
        fi
        set ustate="3"
        save_env rootdev ustate
    else
        set bootcount="1"
        save_env bootcount
    fi
fi

menuentry "Eicke Linux (${rootdev})" {
    # Load the kernel from the ESP (grub's own ${root}); the kernel is shared
    # across slots. We deliberately do NOT 'search --label ${rootdev}': swupdate
    # writes the rootfs image raw onto the slot, which overwrites the partition's
    # ext4 label (the image isn't labelled per-slot), so a filesystem-label
    # search for rootfs_b fails after an update. The kernel then mounts the
    # correct slot via root=PARTLABEL (GPT partition name, untouched by the raw
    # write and resolved natively without an initramfs).
    linux /bzImage root=PARTLABEL=${rootdev} rootwait console=ttyS0 console=tty0
}
