# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Recipes that need meta-freescale (NXP i.MX BSP classes/recipes: the Digi
# ccimx8mn-dvk kernel and U-Boot) are only parsed when that layer is present,
# so the x86/QEMU machines don't depend on it.
#
# Likewise meta-arm (TF-A for the te0820).
BBFILES_DYNAMIC += " \
    freescale-layer:${LAYERDIR}/dynamic-layers/freescale-layer/*/*/*.bb \
    freescale-layer:${LAYERDIR}/dynamic-layers/freescale-layer/*/*/*.bbappend \
    meta-arm:${LAYERDIR}/dynamic-layers/meta-arm/*/*/*.bb \
    meta-arm:${LAYERDIR}/dynamic-layers/meta-arm/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-eicke"
BBFILE_PATTERN_meta-eicke = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-eicke = "10"

# Tell wic where to find our kickstart files
WICVARS:append = " ROOTFS_A_LABEL ROOTFS_B_LABEL"

LAYERDEPENDS_meta-eicke = "core openembedded-layer swupdate"
LAYERSERIES_COMPAT_meta-eicke = "wrynose"
