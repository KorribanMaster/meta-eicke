#@TYPE: Machine
#@NAME: ax7015b
#@SOC: Zynq-7000 (XC7Z015)
#@DESCRIPTION: ALINX AX7015B (2x Cortex-A9, 1 GiB DDR3) running the eicke A/B image from microSD

# Mainline BSP from oe-core, no meta-xilinx: U-Boot SPL (with the board's
# ps7_init from the Vivado reference design) replaces the Xilinx FSBL, and
# linux-yocto uses kernel-cache's amd-zynq BSP. PS only: the PL is not loaded
# at boot. See doc/machines/ax7015b.md.

require conf/machine/include/arm/armv7a/tune-cortexa9.inc

MACHINE_FEATURES = "ext2 vfat serial usbhost"

# ---- Bootloader: U-Boot SPL + U-Boot ----------------------------------------
# The boot ROM loads boot.bin (SPL with the Zynq boot header) from the first
# FAT partition of the microSD; SPL runs ps7_init (DDR, clocks, MIO) and loads
# u-boot.img (a FIT) from the same partition. Board files and the eicke env
# setup come from the u-boot bbappend (ax7015b override).
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
UBOOT_MACHINE = "xilinx_zynq_virt_defconfig"
SPL_BINARY = "spl/boot.bin"
UBOOT_SUFFIX = "img"
EXTRA_IMAGEDEPENDS += "virtual/bootloader"

# ---- Kernel: linux-yocto, kernel-cache amd-zynq BSP --------------------------
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
KMACHINE = "amd-zynq"
KERNEL_IMAGETYPE = "zImage"
# Installed into each slot's /boot by kernel-devicetree (eicke-image.bb), where
# the compiled-in bootcmd loads it from (per-slot, like the kernel).
KERNEL_DEVICETREE = "xilinx/zynq-ax7015b.dtb"

SERIAL_CONSOLES = "115200;ttyPS0"

# ---- eicke A/B --------------------------------------------------------------
# Same contract as qemuarm-uboot and ccimx8mn-dvk: the slot logic is compiled
# into U-Boot (CONFIG_BOOTCOMMAND), the A/B state (rootdev/ustate/bootcount)
# lives in uboot.env on the microSD's FAT boot partition (eicke-ubootenv
# override: libubootenv fw_env.config -> /boot/uboot.env, swupdate's U-Boot
# handler).
EICKE_BOOTLOADER = "u-boot"
MACHINEOVERRIDES =. "eicke-ubootenv:"

# MBR-partitioned microSD (the boot ROM does not read GPT): boot.bin and
# u-boot.img next to uboot.env on the FAT partition.
WKS_FILE = "eicke-ab-zynq-sd.wks.in"
IMAGE_BOOT_FILES = "boot.bin u-boot.img"
