#@TYPE: Machine
#@NAME: fishball-sdr
#@SOC: Zynq-7000 (XC7Z020)
#@DESCRIPTION: Fish Ball SDR (7020_AD936X_SDR: 2x Cortex-A9, 1 GiB DDR3L, AD936x) running the eicke A/B image from microSD

# Mainline U-Boot SPL (with the PS init from the vendor's Vivado handoff)
# replaces the Xilinx FSBL, like ax7015b, but the kernel is ADI's fork
# (linux-adi): mainline has no AD936x driver. U-Boot loads the PL bitstream
# from the active slot before the kernel. See doc/machines/fishball-sdr.md.

require conf/machine/include/arm/armv7a/tune-cortexa9.inc

MACHINE_FEATURES = "ext2 vfat serial usbhost usbgadget"

# ---- Bootloader: U-Boot SPL + U-Boot ----------------------------------------
# The boot ROM loads boot.bin (SPL with the Zynq boot header) from the first
# FAT partition of the microSD; SPL runs ps7_init (DDR, clocks, MIO) and loads
# u-boot.img (a FIT) from the same partition. Board files and the eicke env
# setup come from the u-boot bbappend (fishball-sdr override).
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
UBOOT_MACHINE = "xilinx_zynq_virt_defconfig"
SPL_BINARY = "spl/boot.bin"
UBOOT_SUFFIX = "img"
EXTRA_IMAGEDEPENDS += "virtual/bootloader"

# ---- Kernel: ADI's fork ------------------------------------------------------
PREFERRED_PROVIDER_virtual/kernel = "linux-adi"
KERNEL_IMAGETYPE = "zImage"
# The board's PS plus the PL design and the AD936x. Installed into each slot's
# /boot (kernel-devicetree, below), where the compiled-in bootcmd loads it
# from and patches in the AD936x variant.
KERNEL_DEVICETREE = "xilinx/zynq-fishball-sdr-ad936x.dtb"

SERIAL_CONSOLES = "115200;ttyPS0"

# Every image needs these to boot on this machine, not just eicke-image-sdr:
# - the slot's bitstream and device tree: the bootcmd does not boot a slot
#   without them (the device tree describes the PL cores, and touching them
#   with the PL unconfigured hangs the bus);
# - the watchdog feeder: U-Boot starts the system watchdog on every boot and
#   leaves it to systemd (eicke-fishball-sdr.cfg), so without it the board
#   resets 60 s after U-Boot, over and over (as on te0820).
# packagegroup-core-boot (in every image based on core-image-minimal) pulls
# them in.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "fishball-sdr-bitstream kernel-devicetree"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "eicke-watchdog"

# ---- eicke A/B --------------------------------------------------------------
# Same contract as ax7015b: the slot logic is compiled into U-Boot
# (CONFIG_BOOTCOMMAND), the A/B state (rootdev/ustate/bootcount) lives in
# uboot.env on the microSD's FAT boot partition (eicke-ubootenv override:
# libubootenv fw_env.config -> /boot/uboot.env, swupdate's U-Boot handler).
EICKE_BOOTLOADER = "u-boot"
MACHINEOVERRIDES =. "eicke-ubootenv:"

# MBR-partitioned microSD (the boot ROM does not read GPT), the layout ax7015b
# uses: boot.bin and u-boot.img next to uboot.env on the FAT partition.
WKS_FILE = "eicke-ab-zynq-sd.wks.in"
IMAGE_BOOT_FILES = "boot.bin u-boot.img"
# wic copies those from the deploy directory: make every wic image depend on
# u-boot's do_deploy, not only images that happen to pull it in otherwise.
WKS_FILE_DEPENDS:append = " virtual/bootloader"
