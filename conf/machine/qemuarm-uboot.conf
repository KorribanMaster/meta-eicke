#@TYPE: Machine
#@NAME: qemuarm-uboot
#@DESCRIPTION: QEMU virt (Cortex-A15, ARM32) booting the eicke A/B image via U-Boot

# Inherit oe-core's qemuarm and keep its override active: linux-yocto matches
# COMPATIBLE_MACHINE / KMACHINE:qemuarm / KBRANCH:qemuarm against the
# "qemuarm" entry in MACHINEOVERRIDES.
MACHINEOVERRIDES =. "qemuarm:"
require conf/machine/qemuarm.conf

# Bootloader flavour of the eicke A/B scheme; eicke-image.bb requires
# recipes-core/images/eicke-ab-${EICKE_BOOTLOADER}.inc (x86 machines default
# to grub-efi). PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot" and
# UBOOT_MACHINE ?= "qemu_arm_defconfig" already come from qemuarm.conf.
EICKE_BOOTLOADER = "u-boot"

# Same A/B GPT layout as eicke-ab.wks.in, but the boot partition is a plain
# FAT filled by bootimg-partition (boot.scr + uboot.env) instead of an ESP.
WKS_FILE = "eicke-ab-uboot.wks.in"

# runqemu: load U-Boot as firmware (-bios) and hand it the full A/B wic disk.
# No -kernel: U-Boot loads zImage from the active slot's /boot (per-slot
# kernel, like GRUB on x86). KVM is impossible for ARM32 guests on x86 hosts.
QB_DEFAULT_BIOS = "u-boot.bin"
QB_DEFAULT_FSTYPE = "wic"
QB_DEFAULT_KERNEL = "none"
QEMU_USE_KVM = ""

# Attach the wic as a virtio-blk device (NOT runqemu's default virtio-scsi for
# wic images): U-Boot's env-in-FAT and boot.scr address the disk as virtio 0
# (CONFIG_ENV_FAT_INTERFACE/boot.cmd), and virtio-scsi is invisible to it.
QB_DRIVE_TYPE = "/dev/vdb"

# Signed kernel FIT capability (build-and-boot; enforcement deferred). Inert
# until an image installs the linux-yocto-fitimage package (eicke-image-prod
# does, on ARM); base builds still boot the plain zImage via boot.cmd's
# fallback. See conf/machine/include/eicke-verified-boot.inc + doc/verified-boot.md.
require conf/machine/include/eicke-verified-boot.inc
