#@TYPE: Machine
#@NAME: te0820
#@SOC: Zynq UltraScale+ MPSoC (XCZU2CG)
#@DESCRIPTION: Trenz TE0820-02 (2x Cortex-A53, 2x Cortex-R5F, 1 GiB DDR4) on a TE0703 carrier running the eicke A/B image from microSD

# Mainline BSP from oe-core and meta-arm, no meta-xilinx: U-Boot SPL (with the
# module's psu_init from the Trenz reference design) replaces the Xilinx FSBL,
# TF-A comes from meta-arm, the PMU firmware is a pinned prebuilt, and
# linux-yocto uses kernel-cache's amd-zynqmp BSP. PS only: the PL is not loaded
# at boot. See doc/machines/te0820.md.

require conf/machine/include/arm/armv8a/tune-cortexa53.inc

MACHINE_FEATURES = "ext2 vfat serial usbhost"

# ---- Bootloader: U-Boot SPL + TF-A + U-Boot ---------------------------------
# The boot ROM loads boot.bin (SPL plus the PMU firmware, with the ZynqMP boot
# header) from the first FAT partition of the microSD. SPL runs psu_init (DDR,
# clocks, MIO), hands the PM configuration object to the PMU firmware and loads
# u-boot-<hash>.itb (a FIT with TF-A bl31, U-Boot and its DTB, named after
# its build so each boot.bin loads only its own) from the same partition. Board files and the eicke env setup come from the u-boot bbappend
# (te0820 override).
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
UBOOT_MACHINE = "xilinx_zynqmp_virt_defconfig"
SPL_BINARY = "spl/boot.bin"
UBOOT_SUFFIX = "itb"
EXTRA_IMAGEDEPENDS += "virtual/bootloader"

# ---- Kernel: linux-yocto, kernel-cache amd-zynqmp BSP ------------------------
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
KMACHINE = "amd-zynqmp"
KERNEL_IMAGETYPE = "Image"
# Installed into each slot's /boot by kernel-devicetree (eicke-image.bb), where
# the compiled-in bootcmd loads it from (per-slot, like the kernel).
KERNEL_DEVICETREE = "xilinx/zynqmp-te0820.dtb"

SERIAL_CONSOLES = "115200;ttyPS0"

# U-Boot starts the system watchdog on every boot and leaves it to systemd
# (eicke-te0820.cfg), so every image needs the feeder, not just eicke-image:
# without it the board resets 60 s after U-Boot, over and over.
# packagegroup-core-boot (in every image based on core-image-minimal) pulls
# it in.
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "eicke-watchdog"

# ---- eicke A/B --------------------------------------------------------------
# Same contract as ax7015b: the slot logic is compiled into U-Boot
# (CONFIG_BOOTCOMMAND), the A/B state (rootdev/ustate/bootcount) lives in
# uboot.env on the microSD's FAT boot partition (eicke-ubootenv override:
# libubootenv fw_env.config -> /boot/uboot.env, swupdate's U-Boot handler).
EICKE_BOOTLOADER = "u-boot"
MACHINEOVERRIDES =. "eicke-ubootenv:"

# MBR-partitioned microSD, the layout ax7015b uses: boot.bin and
# u-boot-<hash>.itb (the u-boot bbappend deploys it to eicke-esp/) next to
# uboot.env on the FAT partition.
WKS_FILE = "eicke-ab-zynq-sd.wks.in"
IMAGE_BOOT_FILES = "boot.bin eicke-esp/u-boot-*.itb"
# wic copies those from the deploy directory: make every wic image depend on
# u-boot's do_deploy (DEPENDS + do_image_wic's recrdeptask), not only images
# that happen to pull it in otherwise.
WKS_FILE_DEPENDS:append = " virtual/bootloader"
