#@TYPE: Machine
#@NAME: qemuimx8mp-evk
#@DESCRIPTION: QEMU imx8mp-evk (i.MX 8M Plus: 4x Cortex-A53 + Cortex-M7 AMP) running the eicke A/B image

# QEMU has no i.MX 8M Nano model; the 8M Plus EVK has the same Cortex-M7
# memory map and MU, so the RustAmp M7 firmware (built for the Nano) runs on
# it unchanged. The M7 itself needs the "Cortex-M7 AMP boot" QEMU series, which
# recipes-devtools/qemu applies to qemu-system-native.

# Inherit oe-core's qemuarm64 and keep its override active: linux-yocto matches
# COMPATIBLE_MACHINE / KMACHINE / KBRANCH / SRCREV against "qemuarm64". The
# cortexa57 tune is plain ARMv8.0 and runs on the A53s.
MACHINEOVERRIDES =. "qemuarm64:"
require conf/machine/qemuarm64.conf

# Kernel-cache BSP: the virt-only qemuarm64 one (kernel-yocto defaults KMACHINE
# to MACHINE, which has no BSP). The i.MX drivers come from imx8mp-qemu.cfg.
KMACHINE = "qemuarm64"

# A/B state lives in a U-Boot-format env file (uboot.env on the FAT boot
# partition, fw_printenv/fw_setenv via libubootenv), shared with qemuarm-uboot
# through the eicke-ubootenv override. No U-Boot actually runs here: QEMU
# imx8mp-evk cannot run the SPL/DDR init, so the kernel is booted directly
# (-kernel/-dtb) and the slot is picked on the QEMU side by
# scripts/eicke-runqemu-imx8mp.sh. SWUpdate still writes the standby slot and
# flips rootdev/ustate, but nothing rolls back automatically.
MACHINEOVERRIDES =. "eicke-ubootenv:"
EICKE_BOOTLOADER = "u-boot"
WKS_FILE = "eicke-ab-uboot.wks.in"
# wic's aarch64 default (grub-efi systemd-boot) is unused: no EFI here. The
# machine override beats WKS_FILE_DEPENDS_BOOTLOADERS:aarch64.
WKS_FILE_DEPENDS_BOOTLOADERS:qemuimx8mp-evk = ""

# Mainline imx8mp-evk + the M7 remoteproc node, vrings and carve-out (built
# out of the linux-yocto bbappend's imx8mp-evk-rpmsg-qemu.dts).
KERNEL_DEVICETREE = "freescale/imx8mp-evk-rpmsg-qemu.dtb"

# UART2 is the A53 console on the EVK; UART4 belongs to the M7.
SERIAL_CONSOLES = "115200;ttymxc1"

# runqemu metadata (qemuboot.conf). The supported entry point is
# scripts/eicke-runqemu-imx8mp.sh: runqemu's wic path cannot attach an
# if=sd,bus=2 drive (the EVK's uSDHC3), so these only describe the machine.
QB_SYSTEM_NAME = "qemu-system-aarch64"
QB_MACHINE = "-machine imx8mp-evk"
QB_CPU = ""
QB_SMP = ""
QB_MEM = "-m 3G"
QB_DTB = "imx8mp-evk-rpmsg-qemu.dtb"
QB_KERNEL_ROOT = "PARTLABEL=rootfs_a"
QB_GRAPHICS = ""
QB_OPT_APPEND = ""
QB_RNG = ""
QEMU_USE_KVM = ""
