#@TYPE: Machine
#@NAME: ccimx8mn-dvk
#@SOC: i.MX8MN
#@DESCRIPTION: Digi ConnectCore 8M Nano DVK (4x Cortex-A53 + Cortex-M7) running the eicke A/B image from microSD

# Ported from meta-digi (scarthgap) ccimx8mn-dvk.conf + ccimx8m.inc, which has
# no wrynose branch. The NXP i.MX pieces (imx-boot/imx-mkimage, imx-atf,
# LPDDR4 training firmware) come from meta-freescale wrynose; the board
# support from Digi's public U-Boot and Linux forks (u-boot-dey, linux-dey in
# dynamic-layers/freescale-layer). Dropped from Digi's conf: the DEY distro
# bits, TrustFence, wifi/bt firmware, XBee and the installer artifacts.
#
# firmware-imx (DDR training blobs) is under the NXP EULA: set
# ACCEPT_FSL_EULA = "1" in local.conf after reading
# sources/meta-freescale/EULA (see doc/machines/ccimx8mn-dvk.md).

MACHINEOVERRIDES =. "mx8mn:"
IMX_DEFAULT_BSP = "nxp"
IMX_DEFAULT_BOOTLOADER = "u-boot-dey"
require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8a/tune-cortexa53.inc

# ---- Bootloader: Digi U-Boot + NXP imx-boot container -----------------------
PREFERRED_PROVIDER_u-boot = "u-boot-dey"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-dey"
# imx-base.inc assumes every bootloader but u-boot-imx builds its own boot
# container (binman flash.bin); Digi's U-Boot needs imx-boot (imx-mkimage) like
# u-boot-imx. Must use the same override to win over imx-base.inc.
UBOOT_PROVIDES_BOOT_CONTAINER:mx8m-generic-bsp = "0"

UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "ccimx8mn_dvk_defconfig"
SPL_BINARY = "spl/u-boot-spl.bin"
UBOOT_DTB_NAME = "ccimx8mn-dvk.dtb"
UBOOT_SUFFIX = "bin"
UBOOT_MAKE_TARGET = "all"

ATF_PLATFORM = "imx8mn"
# UART1 (ttymxc0), the DVK console.
ATF_BOOT_UART_BASE = "0x30860000"

IMX_BOOT_SOC_TARGET = "iMX8MN"
IMX_BOOT_SEEK = "32"
IMXBOOT_TARGETS = "flash_evk"
DDR_FIRMWARE_NAME = " \
    lpddr4_pmu_train_1d_imem.bin \
    lpddr4_pmu_train_1d_dmem.bin \
    lpddr4_pmu_train_2d_imem.bin \
    lpddr4_pmu_train_2d_dmem.bin \
"

# ---- Kernel: Digi linux (NXP 6.6 based) --------------------------------------
PREFERRED_PROVIDER_virtual/kernel = "linux-dey"
KERNEL_IMAGETYPE = "Image"
# Base DTB plus the overlays the compiled-in bootcmd applies (Digi's SOM/DVK
# revision selection from its boot.txt, see u-boot-dey
# eicke-bootcmd-ccimx8mn.cfg), and the eicke CM7 overlay matching the RustAmp
# firmware's memory layout. No wifi/bt overlays: their firmware isn't shipped.
# Installed flat into each slot's /boot by kernel-devicetree (eicke-image.bb).
KERNEL_DEVICETREE = " \
    digi/ccimx8mn-dvk.dtb \
    digi/ccimx8mn_v1.dtbo \
    digi/ccimx8mn-dvk_v1-v2.dtbo \
    digi/eicke-ccimx8mn-cm7.dtbo \
"

SERIAL_CONSOLES = "115200;ttymxc0"

# ---- eicke A/B --------------------------------------------------------------
# Same contract as qemuarm-uboot: the slot logic is compiled into U-Boot
# (CONFIG_BOOTCOMMAND) and the A/B state (rootdev/ustate/bootcount) lives in
# uboot.env on the microSD's FAT boot partition (eicke-ubootenv override:
# libubootenv fw_env.config -> /boot/uboot.env, swupdate's U-Boot handler).
EICKE_BOOTLOADER = "u-boot"
MACHINEOVERRIDES =. "eicke-ubootenv:"

# SD-card image: imx-boot raw at 32 KiB, then the eicke A/B partitions.
WKS_FILE = "eicke-ab-imx8m-sd.wks.in"
WKS_FILE_DEPENDS:append = " imx-boot"
# No EFI on this board (wic's aarch64 default would build grub-efi + systemd-boot).
WKS_FILE_DEPENDS_BOOTLOADERS:ccimx8mn-dvk = ""
