# Eicke distro: a minimal, systemd-based OpenEmbedded distribution.
#
# Replaces the poky reference distro. We do NOT require meta-poky; the distro
# defaults (providers, distro vars, toolchain, uninative, init manager) come
# from openembedded-core's conf/distro/defaultsetup.conf, which bitbake.conf
# always includes after this file.

DISTRO = "eicke"
DISTRO_NAME = "Eicke Linux"
DISTRO_VERSION = "6.0"
DISTRO_CODENAME = "wrynose"
MAINTAINER = "Eicke Hecht <eicke.hecht@gmail.com>"
SDK_VERSION = "${DISTRO_VERSION}"

# Use the standard OE distro feature set. INIT_MANAGER = "systemd" (below) pulls
# in init-manager-systemd.inc, which appends "systemd usrmerge" and wires up the
# systemd init/dev managers.
DISTRO_FEATURES ?= "${DISTRO_FEATURES_DEFAULTS}"

# overlayfs: enables the kernel overlay filesystem support needed by the prod
# image's overlayfs-etc feature (persistent /etc overlay on the data partition).
DISTRO_FEATURES:append = " overlayfs"

# ---- Verified boot: one switch across all bootloaders -----------------------
# EICKE_VERIFIED_BOOT = "1" in local.conf is the single knob that turns on
# production verified boot, mapped to the right mechanism per architecture:
#   - the eicke-verified-boot distro feature, which every prod image + the
#     bootloader/signing recipes gate on (see recipes-core/images/eicke-verified-boot.inc);
#   - on x86 additionally meta-secure-core's efi-secure-boot, which drives the
#     signed shim/SELoader/grub (disk) and db-signed iPXE + UKI (netboot) chain;
#   - on ARM (qemuarm-uboot) the signed kernel FIT (see
#     conf/machine/include/eicke-verified-boot.inc, gated on the feature).
# Read as a plain variable (local.conf parses before this distro conf), so no
# DISTRO_FEATURES self-reference is needed. The :x86-64 override resolves during
# distro-conf parse (as in eicke-image.bb's IMAGE_INSTALL:append:x86-64).
DISTRO_FEATURES:append = "${@' eicke-verified-boot' if (d.getVar('EICKE_VERIFIED_BOOT') or '0') == '1' else ''}"
DISTRO_FEATURES:append:x86-64 = "${@' efi-secure-boot' if (d.getVar('EICKE_VERIFIED_BOOT') or '0') == '1' else ''}"

# Convenience form of the gate ("1"/"0"), lazily evaluated (resolves after
# DISTRO_FEATURES is assembled). Recipes gate their verified-boot composition on
# it: `IMAGE_INSTALL:append = "${@' pkg' if d.getVar('EICKE_VBOOT') == '1' ...}"`.
EICKE_VBOOT = "${@bb.utils.contains('DISTRO_FEATURES', 'eicke-verified-boot', '1', '0', d)}"

# ---- Signing key vocabulary (one store, one set of names) --------------------
# All signing keys live in EICKE_KEYS_DIR (host ~/yocto/keys, mounted at
# /yocto/keys; populated by scripts/eicke-gen-keys.sh). Defaults here so a
# verified-boot build needs only EICKE_VERIFIED_BOOT=1 + a populated store.
# Targets and their signers (see doc/verified-boot.md):
#   swupdate .swu  -> EICKE_KEYS_DIR/swupdate-priv.pem   (swupdate-signing.inc)
#   ARM kernel FIT -> EICKE_KEYS_DIR/${EICKE_FIT_KEYNAME}.{key,crt} (uboot-sign/kernel-fit)
#   x86 UEFI SB    -> EICKE_KEYS_DIR/sb-user/uefi_sb_keys (meta-secure-core user-key-store)
EICKE_KEYS_DIR ??= "/yocto/keys"
EICKE_FIT_KEYNAME ?= "eicke-fit"

# x86 UEFI Secure Boot user key store (meta-secure-core). ?= so local.conf can
# override the layout; unused when efi-secure-boot is off.
SIGNING_MODEL ?= "user"
MASTER_KEYS_DIR ?= "${EICKE_KEYS_DIR}/sb-user"
UEFI_SB_KEYS_DIR ?= "${MASTER_KEYS_DIR}/uefi_sb_keys"
MOK_SB_KEYS_DIR ?= "${MASTER_KEYS_DIR}/mok_sb_keys"
BOOT_KEYS_DIR ?= "${MASTER_KEYS_DIR}/boot_keys"

# systemd as PID 1. defaultsetup.conf already defaults to systemd on 6.0; set it
# explicitly here so the choice is independent of any future upstream default.
INIT_MANAGER ?= "systemd"
